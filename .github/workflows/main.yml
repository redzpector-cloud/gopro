name: Build JEJAK CAM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          echo "=== FILE PROJECT ==="
          find . -maxdepth 4 -type f | sort

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir=$(dirname "$file")

            if [ -f "$dir/settings.gradle.kts" ] || [ -f "$dir/settings.gradle" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            exit 1
          fi

          echo "================================"
          echo "PROJECT DITEMUKAN:"
          echo "$PROJECT_DIR"
          echo "================================"

          cd "$PROJECT_DIR"

          echo "=== BUILD APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JejakCam-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
